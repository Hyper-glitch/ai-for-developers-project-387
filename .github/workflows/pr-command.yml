name: OpenCode PR command
# This immutable title is the counter key. Comment text never supplies the key.
run-name: &command_title >-
  ${{
    (github.event.issue.pull_request || github.event.pull_request) &&
    github.event.comment.user.type == 'User' &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
    (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
     github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode ')) &&
    format('OpenCode PR #{0}', github.event.issue.number || github.event.pull_request.number) ||
    format('Ignored comment {0}', github.run_id)
  }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: *command_title
  queue: max

permissions: {}
defaults:
  run:
    shell: bash
env:
  PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  command:
    if: >-
      github.repository == 'Hyper-glitch/ai-for-developers-project-387' &&
      (github.event.issue.pull_request || github.event.pull_request) &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      reason: ${{ steps.budget.outputs.reason || steps.agent.outputs.reason }}
    steps:
      - name: Verify PR and sender
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          if jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .base.ref == "main" and .base.repo.full_name == $repo
            and .head.repo.full_name == $repo and .head.ref != "main"
            and ((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
                 or (.user.login | IN("opencode-agent[bot]", "github-actions[bot]")))
            ' "$RUNNER_TEMP/pr.json" > /dev/null; then
            authors=("$COMMENT_AUTHOR")
            if [[ "$GITHUB_TRIGGERING_ACTOR" != "$COMMENT_AUTHOR" ]]; then
              authors+=("$GITHUB_TRIGGERING_ACTOR")
            fi
            for author in "${authors[@]}"; do
              permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq .permission)
              [[ "$permission" == write || "$permission" == admin ]] || exit 0
            done
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      # The budget reader can distinguish an access refusal from a timeout or
      # cancellation by looking at this step in this specific attempt's jobs.
      - name: Reject untrusted command
        if: steps.trust.outputs.allowed != 'true'
        run: echo 'PR or caller did not pass the trust check.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.trust.outputs.allowed == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Keep the guard and the model in the SAME job: Re-run failed jobs must
      # execute the guard again before it can restart OpenCode.
      - name: Check command budget
        if: steps.trust.outputs.allowed == 'true'
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/pr-command.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | {id, display_title, run_attempt, status}' | jq -s '.' |
            node .github/scripts/pr-budget.mjs

      - uses: ./.github/actions/restore-skills
        if: steps.trust.outputs.allowed == 'true'

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        if: steps.trust.outputs.allowed == 'true'
        with:
          version: 2026.11.3
        env:
          MISE_NO_HOOKS: '1'

      - run: mise run install
        if: steps.trust.outputs.allowed == 'true'

      - name: Prepare OpenCode
        if: steps.trust.outputs.allowed == 'true'
        timeout-minutes: 4
        env:
          AUTH_READY: ${{ secrets.OPENAI_API_KEY != '' || secrets.OPENCODE_AUTH_CONTENT != '' }}
        run: |
          test "$AUTH_READY" = true || { echo "::error::OpenCode model credentials missing"; exit 1; }
          npm install --prefix "$RUNNER_TEMP/pr-cli" --no-audit --no-fund opencode-ai@1.19.6
          "$RUNNER_TEMP/pr-cli/node_modules/.bin/opencode" --version

      - name: Run OpenCode on the PR branch
        id: agent
        if: steps.trust.outputs.allowed == 'true'
        env:
          MODEL: openai/gpt-6.2-sol
          GH_TOKEN: ${{ github.token }}
          MENTIONS: /oc,/opencode
          SHARE: 'false'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
        run: |
          code=0
          timeout --kill-after=20s 15m "$RUNNER_TEMP/pr-cli/node_modules/.bin/opencode" github run || code=$?
          case "$code" in
            0) exit 0 ;;
            124|137) echo 'reason=timeout' >> "$GITHUB_OUTPUT" ;;
            *) echo 'reason=agent_failed' >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$code"

  report:
    if: always() && (needs.command.result == 'failure' || needs.command.result == 'cancelled')
    needs: command
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Publish failure and latest PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.command.outputs.reason }}
        run: |
          if [[ -z "$REASON" ]]; then
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "command") | .conclusion')
            case "$conclusion" in
              timed_out) REASON=timeout ;;
              cancelled) REASON=cancelled ;;
              *) REASON=infra ;;
            esac
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          logs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          printf 'Нужен человек. Причина `%s`.\n\nHead SHA `%s`. [Журнал запуска](%s).\n' \
            "$REASON" "$sha" "$logs" > "$RUNNER_TEMP/pr-command-report.md"
          cat "$RUNNER_TEMP/pr-command-report.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-command-report.md"
