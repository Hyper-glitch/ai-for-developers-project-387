name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && 'PR checks' || 'Branch checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          version: 2026.11.3
      - run: mise run install
      - run: mise run check

  browser:
    name: ${{ github.event_name == 'pull_request' && 'PR browser (head)' || 'Browser (PR only)' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        id: checkout
        run: |
          actual=$(git rev-parse HEAD)
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Checked out $actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          version: 2026.11.3
      - run: mise run install:backend && mise run install:frontend && mise run install:e2e
      - name: Run Chromium against the PR head
        id: playwright
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/e2e/test-results/junit.xml
        run: |
          mise exec -- npm --prefix e2e test -- --trace=on --reporter=list,junit
          test -s "$PLAYWRIGHT_JUNIT_OUTPUT_FILE"
          test -n "$(find e2e/test-results -name trace.zip -type f -size +0c -print -quit)"
      - name: Record SHA and result
        if: always() && steps.checkout.outputs.sha != ''
        env:
          ACTUAL_SHA: ${{ steps.checkout.outputs.sha }}
          OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          mkdir -p e2e/test-results
          jq -n --arg sha "$ACTUAL_SHA" --arg outcome "$OUTCOME" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{sha: $sha, playwright: $outcome, run: $run}' > e2e/test-results/result.json
          cat e2e/test-results/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.checkout.outputs.sha != ''
        with:
          name: browser-pr-${{ github.event.number }}-${{ steps.checkout.outputs.sha }}-${{ github.run_attempt }}
          path: e2e/test-results/
          if-no-files-found: error
          retention-days: 30
