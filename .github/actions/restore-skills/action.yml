name: Restore project skills
description: Install Matt Pocock's skills for OpenCode from the revision used in skills-lock.json
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: mattpocock/skills
        ref: 4ae2317ddb22b046e26455e4f9c9b3aaaf62212d
        path: .agents/skill-source
        persist-credentials: false
    - shell: bash
      run: |
        mkdir -p .agents/skills
        jq -r '.skills | to_entries[] | [.key, .value.skillPath] | @tsv' skills-lock.json |
          while IFS=$'\t' read -r name skill_file; do
            cp -R ".agents/skill-source/${skill_file%/*}" ".agents/skills/$name"
          done
